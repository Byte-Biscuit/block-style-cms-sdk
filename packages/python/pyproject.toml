[project]
name = "block-style-cms-sdk"
version = "0.0.3"
description = "Python SDK for Block Style CMS"
authors=[
  { name = "Biscuit Zhou", email = "biscuit_zhou@outlook.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cms", "blocknote", "markdown", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/block_style_cms_sdk"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Long-form markdown fixtures are intentional prose, not wrap-worthy source.
[tool.ruff.lint.per-file-ignores]
"tests/publish_trilingual_longform.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
