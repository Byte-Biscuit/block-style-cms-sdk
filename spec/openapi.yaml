openapi: 3.1.0
info:
  title: Block Style CMS Admin API (SDK subset)
  version: 0.2.0
  description: |
    Contract for the Block Style CMS SDK article closed loop.
    Auth: API token via x-api-key or Authorization Bearer.
    Design docs: docs/article-api-contract.md
servers:
  - url: https://cms.example.com
    description: Your CMS base URL (no trailing slash required)
security:
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /api/m/images:
    post:
      operationId: uploadImage
      summary: Upload an image
      tags: [media]
      description: |
        Same processed content hash returns the existing ImageMetaInfo
        without writing a new file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                options:
                  type: string
                  description: JSON string of ImageUploadOptions
      responses:
        "200":
          description: Upload succeeded (HTTP 200; check body.code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"

  /api/m/images/{filename}:
    delete:
      operationId: deleteImage
      summary: Delete an image from the media library
      tags: [media]
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted (HTTP 200; check body.code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"

  /api/m/articles:
    get:
      operationId: listArticles
      summary: List article metadata
      tags: [articles]
      parameters:
        - name: locale
          in: query
          schema:
            $ref: "#/components/schemas/Locale"
        - name: tag
          in: query
          schema:
            type: string
          description: Substring match on tags (use channel tag id for channels)
        - name: searchTerm
          in: query
          schema:
            type: string
        - name: published
          in: query
          description: >
            Status filter token (not a boolean). Use `published`, `draft`, or
            `all`. Values such as `true` / `false` are rejected by the CMS.
            Distinct from article create/update body field `published` (boolean).
          schema:
            type: string
            enum: [published, draft, all]
            default: all
        - name: pageIndex
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: List retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
    put:
      operationId: updateArticle
      summary: Update article metadata and/or content
      tags: [articles]
      description: |
        Requires id. Omit content to keep existing blocks (metadata / publish toggle).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateArticleRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"

  /api/m/articles/from-markdown:
    post:
      operationId: createArticleFromMarkdown
      summary: Create an article from markdown body
      tags: [articles]
      description: |
        Markdown body must contain no frontmatter. Relative image paths
        must already be rewritten to /images/{filename} or http(s) URLs
        (the SDK does this before calling). Always creates a new id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FromMarkdownRequest"
      responses:
        "200":
          description: Article created (HTTP 200; check body.code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FromMarkdownResult"
        "400":
          description: Validation or unresolved image paths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
    put:
      operationId: updateArticleFromMarkdown
      summary: Update an existing article from markdown
      tags: [articles]
      description: Requires id; slug must match. Does not create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFromMarkdownRequest"
      responses:
        "200":
          description: Article updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FromMarkdownResult"
        "400":
          description: Validation or unresolved image paths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"

  /api/m/articles/{slug}/{id}:
    get:
      operationId: getArticle
      summary: Get article by slug and id
      tags: [articles]
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/ArticleId"
        - name: includeMdContent
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "1"]
          description: When set, payload also includes mdContent (markdown export)
      responses:
        "200":
          description: Article with BlockNote content; mdContent only if requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
    delete:
      operationId: deleteArticle
      summary: Delete article by slug and id
      tags: [articles]
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"

  /api/m/articles/by-slug/{slug}:
    get:
      operationId: getArticleBySlug
      summary: Get article by slug and locale
      tags: [articles]
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: locale
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Locale"
        - name: includeMdContent
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "1"]
          description: When set, payload also includes mdContent (markdown export)
      responses:
        "200":
          description: Article with BlockNote content; mdContent only if requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
    delete:
      operationId: deleteArticleBySlug
      summary: Delete article by slug and locale
      tags: [articles]
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: locale
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Locale"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"

  /api/m/channels:
    get:
      operationId: listChannels
      summary: List site channels (栏目)
      tags: [content]
      responses:
        "200":
          description: Channels retrieved (HTTP 200; check body.code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelListResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"

  /api/m/locales:
    get:
      operationId: listLocales
      summary: List site-supported article languages
      tags: [content]
      responses:
        "200":
          description: Locales retrieved (HTTP 200; check body.code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocaleListResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResult"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    ArticleId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ApiResult:
      type: object
      required: [code, message, payload]
      properties:
        code:
          type: integer
          description: Application status (200 = success)
        message:
          type: string
        payload:
          description: Endpoint-specific payload
        tt:
          type: number
          description: Optional timing ms

    Locale:
      type: string
      description: |
        Article language tag for this CMS deployment (e.g. zh-CN, en-US, ja-JP).
        Allowed values are site-specific — use GET /api/m/locales, not a fixed enum.

    ImageUploadOptions:
      type: object
      properties:
        quality:
          type: integer
          minimum: 1
          maximum: 100
        maxWidth:
          type: integer
          minimum: 100
          maximum: 4096
        maxHeight:
          type: integer
          minimum: 100
          maximum: 4096
        enableWebP:
          type: boolean

    ImageMetaInfo:
      type: object
      required: [filename, originalName, size, width, height, mimeType, uploadedAt]
      properties:
        filename:
          type: string
        originalName:
          type: string
        size:
          type: integer
        width:
          type: integer
        height:
          type: integer
        mimeType:
          type: string
        uploadedAt:
          type: string
        fullUrl:
          type: string
        contentHash:
          type: string
          description: SHA-256 of processed bytes (dedupe key)
        title:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        altText:
          type: string

    ImageUploadResult:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            payload:
              $ref: "#/components/schemas/ImageMetaInfo"

    FromMarkdownRequest:
      type: object
      required: [title, slug, language]
      properties:
        title:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        summary:
          type: string
          default: ""
        tags:
          type: array
          items:
            type: string
          default: []
        keywords:
          type: array
          items:
            type: string
          default: []
        language:
          $ref: "#/components/schemas/Locale"
        mdContent:
          type: string
          description: Markdown body (camelCase)
        md-content:
          type: string
          description: Markdown body (kebab-case alias)
        cover:
          type: string
          description: Cover image URL or /images/{filename}
          default: ""
        published:
          type: boolean
          default: false
        __locale__:
          type: string
          description: UI/validation message locale (not article language)

    UpdateFromMarkdownRequest:
      allOf:
        - $ref: "#/components/schemas/FromMarkdownRequest"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid

    FromMarkdownPayload:
      type: object
      required: [id, slug, locale]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        locale:
          $ref: "#/components/schemas/Locale"

    FromMarkdownResult:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            payload:
              $ref: "#/components/schemas/FromMarkdownPayload"

    ArticleMetadata:
      type: object
      required: [id, slug, title, locale]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        locale:
          $ref: "#/components/schemas/Locale"
        image:
          type: string
        published:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    Article:
      allOf:
        - $ref: "#/components/schemas/ArticleMetadata"
        - type: object
          properties:
            content:
              type: array
              items: {}
              description: CMS LocalBlock JSON
            mdContent:
              type: string
              description: |
                Markdown export (only when includeMdContent=true|1).
                Embedded images as absolute http(s) URLs.

    ArticleResult:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            payload:
              $ref: "#/components/schemas/Article"

    ArticleListPayload:
      type: object
      required: [data, pageIndex, pageSize, total, totalPages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ArticleMetadata"
        pageIndex:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ArticleListResult:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            payload:
              $ref: "#/components/schemas/ArticleListPayload"

    UpdateArticleRequest:
      type: object
      required: [id, slug, title, locale]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        tags:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        locale:
          $ref: "#/components/schemas/Locale"
        image:
          type: string
        published:
          type: boolean
        content:
          type: array
          items: {}
          description: Optional; omit to keep existing blocks
        __locale__:
          type: string

    ChannelItem:
      type: object
      required: [id, type, href]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [tag, page]
        href:
          type: string
        tag:
          type: string
        icon:
          type: string

    ChannelListResult:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            payload:
              type: array
              items:
                $ref: "#/components/schemas/ChannelItem"

    LocaleInfo:
      type: object
      required: [code, name, nativeName, englishName, flag]
      properties:
        code:
          $ref: "#/components/schemas/Locale"
        name:
          type: string
        nativeName:
          type: string
        englishName:
          type: string
        flag:
          type: string

    LocaleListResult:
      allOf:
        - $ref: "#/components/schemas/ApiResult"
        - type: object
          properties:
            payload:
              type: array
              items:
                $ref: "#/components/schemas/LocaleInfo"
