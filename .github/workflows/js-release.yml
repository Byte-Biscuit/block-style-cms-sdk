name: JS Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'js-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        working-directory: .
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish
        if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'js-v')
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
