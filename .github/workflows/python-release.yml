name: Python Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'py-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/block-style-cms-sdk
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv build
      - name: Publish
        if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'py-v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
